<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helmline</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f5f1; --fg:#1b1f24; --muted:#5d6670; --accent:#1f6f8b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#12161b; --fg:#e8eaec; --muted:#9aa4ae; --accent:#5fb3cf; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:0 16px; }
    main { text-align:center; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin:0; letter-spacing:-0.02em; }
    h1 span { color:var(--accent); }
    p { color:var(--muted); margin:.75rem 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, <span>Helmline</span></h1>
    <p>Served by Cloudflare Workers, deployed from GitHub.</p>
  </main>
</body>
</html>
